# Game Hub — docker compose up -d --build   (config : cp .env.example .env)
# Placez votre reverse proxy (Nginx…) devant le port HOST_PORT — voir DEPLOIEMENT.md.
services:
  game-hub:
    build: .
    image: game-hub:latest
    container_name: game-hub
    restart: unless-stopped
    init: true # transmet SIGTERM à Node (arrêt propre)
    ports:
      # HOST_BIND=127.0.0.1 si Nginx tourne sur la même machine (accès direct fermé)
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      MAX_PLAYERS_PER_ROOM: ${MAX_PLAYERS_PER_ROOM:-8}
      RECONNECT_GRACE_MS: ${RECONNECT_GRACE_MS:-60000}
      # Connexion Discord (désactivée tant que CLIENT_ID/SECRET sont vides)
      PUBLIC_URL: ${PUBLIC_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_ROLE_IDS: ${DISCORD_ROLE_IDS:-}
      DISCORD_ALLOWED_IDS: ${DISCORD_ALLOWED_IDS:-}
      SHARED_ENV_FILE: /run/shared/app.env
    volumes:
      # .env d'une app voisine (ex. ../jdr-web/.env) pour réutiliser sa config Discord.
      # Par défaut /dev/null (rien de partagé).
      - type: bind
        source: ${SHARED_ENV_FILE:-/dev/null}
        target: /run/shared/app.env
        read_only: true
        bind: { create_host_path: false } # chemin faux = erreur claire, pas de dossier fantôme
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
