<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 180" role="img" aria-label="Tarot : le 21, l'Excuse, le Petit et un Roi en éventail">
  <defs>
    <radialGradient id="felt" cx="50%" cy="35%" r="90%">
      <stop offset="0" stop-color="#2a6447"/><stop offset=".6" stop-color="#1c4632"/><stop offset="1" stop-color="#0d2419"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf7ec"/><stop offset="1" stop-color="#ece3cc"/></linearGradient>
    <linearGradient id="trump" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6ecd0"/><stop offset="1" stop-color="#e5d3a6"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter>
    <path id="heart" d="M0 9 C-3 6 -11 1 -11 -4.5 C-11 -9 -6 -11 -3 -9 C-1.6 -8 -.6 -6.6 0 -5.4 C.6 -6.6 1.6 -8 3 -9 C6 -11 11 -9 11 -4.5 C11 1 3 6 0 9 Z"/>
    <path id="star" d="M0 -12 L3 -3.5 L12 -3.5 L5 2 L7.5 11 L0 5.5 L-7.5 11 L-5 2 L-12 -3.5 L-3 -3.5 Z"/>
  </defs>
  <rect width="320" height="180" fill="url(#felt)"/>
  <ellipse cx="160" cy="176" rx="150" ry="22" fill="#000" opacity=".2"/>
  <g filter="url(#sh)">
    <g transform="translate(160 205) rotate(-36) translate(0 -112)">
      <rect x="-30" y="-46" width="60" height="92" rx="6" fill="url(#face)" stroke="#c9b893"/>
      <text x="-23" y="-30" font-family="Georgia, serif" font-weight="700" font-size="15" fill="#b3263a">R</text>
      <use xlink:href="#heart" transform="translate(-18 -18) scale(.45)" fill="#b3263a"/>
      <path d="M-11 -2 L-11 -10 L-5.5 -5 L0 -12 L5.5 -5 L11 -10 L11 -2 Z" fill="#d9a93a" stroke="#76520e" stroke-width=".8"/>
      <use xlink:href="#heart" transform="translate(0 16) scale(.9)" fill="#b3263a"/>
    </g>
    <g transform="translate(160 205) rotate(-12) translate(0 -112)">
      <rect x="-30" y="-46" width="60" height="92" rx="6" fill="url(#trump)" stroke="#9a6c1a"/>
      <rect x="-25" y="-41" width="50" height="82" rx="4" fill="none" stroke="#9a6c1a" stroke-opacity=".6"/>
      <text x="0" y="12" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#76520e">1</text>
      <text x="0" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="7" letter-spacing="1" fill="#76520e">PETIT</text>
    </g>
    <g transform="translate(160 205) rotate(12) translate(0 -112)">
      <rect x="-30" y="-46" width="60" height="92" rx="6" fill="url(#trump)" stroke="#9a6c1a"/>
      <rect x="-25" y="-41" width="50" height="82" rx="4" fill="none" stroke="#9a6c1a" stroke-opacity=".6"/>
      <use xlink:href="#star" transform="translate(0 0) scale(1.4)" fill="#d9a93a" stroke="#76520e" stroke-width=".7"/>
      <text x="0" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="7" letter-spacing="1" fill="#76520e">EXCUSE</text>
    </g>
    <g transform="translate(160 205) rotate(36) translate(0 -112)">
      <rect x="-30" y="-46" width="60" height="92" rx="6" fill="url(#trump)" stroke="#9a6c1a"/>
      <rect x="-25" y="-41" width="50" height="82" rx="4" fill="none" stroke="#9a6c1a" stroke-opacity=".6"/>
      <text x="0" y="-22" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="16" fill="#76520e">21</text>
      <circle cx="0" cy="8" r="13" fill="#d9a93a" opacity=".25"/>
      <use xlink:href="#star" transform="translate(0 8) scale(.9)" fill="#9a6c1a"/>
    </g>
  </g>
  <text x="22" y="34" font-family="Georgia, serif" font-size="12" letter-spacing="3" fill="#dbb666" fill-opacity=".7">GARDE</text>
</svg>
